<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B4D"/>
      <stop offset="1" stop-color="#09051F"/>
    </linearGradient>
    <linearGradient id="neon" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="s" x1="20" y1="15" x2="47" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- favicon background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25"
        fill="none" stroke="url(#neon)" stroke-width="1.5"/>

  <!-- multi-agent network -->
  <g fill="none" stroke="url(#neon)" stroke-width="1.15" opacity=".9">
    <path d="M32 13.5L49.5 23.5L49.5 43.5L32 53.5L14.5 43.5L14.5 23.5Z"/>
    <path d="M32 13.5L32 21.5M49.5 23.5L43 29M49.5 43.5L43 38M32 53.5L32 45M14.5 43.5L21 38M14.5 23.5L21 29"/>
  </g>

  <!-- agent nodes -->
  <g filter="url(#glow)">
    <circle cx="32" cy="12.5" r="3.2" fill="#22D3EE"/>
    <circle cx="51" cy="23" r="3.2" fill="#8B5CF6"/>
    <circle cx="51" cy="44" r="3.2" fill="#C026D3"/>
    <circle cx="32" cy="54" r="3.2" fill="#2563EB"/>
    <circle cx="13" cy="44" r="3.2" fill="#8B5CF6"/>
    <circle cx="13" cy="23" r="3.2" fill="#22D3EE"/>
  </g>

  <!-- central Syntrix S -->
  <path d="M45.2 20.2H27.1c-6.4 0-10.3 3.5-10.3 8.1
           0 4.1 3.1 6.4 8.4 7.7l10.1 2.5c2.3.6 3.2 1.4 3.2 2.7
           0 1.8-1.7 2.8-4.9 2.8H18.6l-4.1 5.8h20.1
           c7.1 0 11.2-3.5 11.2-8.7 0-4.3-3-6.8-8.7-8.2l-9.7-2.4
           c-2.2-.5-3.1-1.3-3.1-2.4 0-1.6 1.6-2.4 4.6-2.4h12.2z"
        fill="url(#s)"/>

  <!-- orbit / coordination cue -->
  <path d="M16.5 40.5C22 46 38.5 48.2 47.5 35.2"
        fill="none" stroke="url(#neon)" stroke-width="1.7"
        stroke-linecap="round" opacity=".95"/>
</svg>